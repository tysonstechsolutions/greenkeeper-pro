# Deploys the Supabase edge functions (AI and server features) whenever they
# change on main, so a new or updated function is never left undeployed.
#
# One-time setup in GitHub: Settings -> Secrets and variables -> Actions ->
# New repository secret named SUPABASE_ACCESS_TOKEN (create the token at
# supabase.com/dashboard/account/tokens). Without it this job only prints a
# reminder and passes.
#
# Which functions skip the login check (verify_jwt = false) comes from
# supabase/config.toml, so redeploys keep production's settings.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: mbgublyqnyghmvqfooao
    steps:
      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set, so functions were not deployed. Add it under Settings > Secrets and variables > Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.token.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions
        if: steps.token.outputs.present == 'true'
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
