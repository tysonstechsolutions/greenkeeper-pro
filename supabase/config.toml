# Local-only Supabase configuration for disposable development and integration
# validation. This project ID is intentionally not a hosted Supabase project ref.
project_id = "greenkeeper-pro-phase1a-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Phase 1A tests create and remove their own clearly prefixed disposable data.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge functions that must stay reachable without a user's login token, matching
# how they are deployed in production (checked 2026-10-06): PIN sign-in and
# sign-up, push notifications, the scheduled daily briefing (shared secret),
# and the drone / spray-window endpoints, which check auth themselves. Every
# other function keeps the default (verify_jwt = true). The deploy workflow
# (.github/workflows/deploy-functions.yml) reads these.
[functions.pin-login]
verify_jwt = false

[functions.pin-signup]
verify_jwt = false

[functions.push-send]
verify_jwt = false

[functions.push-subscribe]
verify_jwt = false

[functions.daily-briefing]
verify_jwt = false

[functions.drone-upload]
verify_jwt = false

[functions.spray-window]
verify_jwt = false
